<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Prettify Minerva — Motion Playground</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23f14259%22/></svg>" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="playground">
      <header class="playground__header">
        <div>
          <p class="eyebrow">Motion playground</p>
          <h1>Prettify Minerva</h1>
        </div>
        <p class="playground__note">1920 × 1080 · 60 fps target · 9 second loop</p>
      </header>

      <section class="stage-frame" aria-label="Prettify Minerva animation preview">
        <div class="stage" id="stage">
          <div class="scene-background" aria-hidden="true">
            <div class="gradient-field"></div>
            <img class="background-texture" src="assets/background-texture.png" alt="" />
            <div class="neutral-wash"></div>
          </div>

          <div class="brand-lockup" aria-label="Prettify Minerva">
            <div class="brand-mark">
              <img src="assets/prettify-logo.svg" alt="" />
            </div>
            <span class="brand-title">Prettify Minerva</span>
          </div>

          <div class="browser" aria-label="Minerva interface redesign demonstration">
            <div class="browser__chrome" aria-hidden="true">
              <div class="traffic-lights">
                <span></span><span></span><span></span>
              </div>
              <div class="tab">
                <span class="tab__label"></span>
                <span class="tab__close">×</span>
              </div>
              <span class="new-tab">+</span>
              <div class="toolbar">
                <span class="toolbar__action">‹</span>
                <span class="toolbar__action toolbar__action--forward">›</span>
                <span class="toolbar__action toolbar__action--reload">↻</span>
                <div class="address-bar"></div>
                <span class="toolbar__menu">⋮</span>
              </div>
            </div>

            <div class="browser__viewport">
              <div class="interface-layer interface-layer--original">
                <img src="assets/minerva-original.png" alt="Original Minerva interface" />
              </div>
              <div class="interface-layer interface-layer--prettified">
                <img src="assets/minerva-prettified.png" alt="Prettify Minerva redesigned interface" />
              </div>
              <div class="transform-sweep" aria-hidden="true"></div>
            </div>
          </div>

          <div class="edge-vignette" aria-hidden="true"></div>
        </div>
      </section>

      <section class="controls" aria-label="Animation controls">
        <div class="transport">
          <button class="control-button control-button--primary" id="playPause" type="button">Pause</button>
          <button class="control-button" id="restart" type="button">Restart</button>
          <output class="time-readout" id="timeReadout" for="timelineScrubber">00:00.00 / 00:09.00</output>
        </div>

        <label class="scrubber-label" for="timelineScrubber">Timeline</label>
        <input
          class="scrubber"
          id="timelineScrubber"
          type="range"
          min="0"
          max="9"
          value="0"
          step="0.001"
        />

        <div class="scene-jumps" aria-label="Jump to scene">
          <button type="button" data-scene="identity">Identity</button>
          <button type="button" data-scene="original">Original</button>
          <button type="button" data-scene="overview">Overview</button>
          <button type="button" data-scene="transform">Transform</button>
          <button type="button" data-scene="quickLinks">Quick Links</button>
          <button type="button" data-scene="polished">Polished</button>
          <button type="button" data-scene="resolve">Resolve</button>
        </div>
      </section>
    </main>

    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="animation.js"></script>
  </body>
</html>
